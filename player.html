<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="google-adsense-account" content="ca-pub-3532576239814430">
  <title>Ajanta Ad Player</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0b0f17;
      color: #e2e8f0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #main-container {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #content-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    #ad-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
    }
    #status-overlay {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 5;
      pointer-events: none;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status-text {
      font-size: 14px;
      letter-spacing: 0.5px;
      color: #94a3b8;
    }
  </style>
  <!-- Google IMA HTML5 SDK -->
  <script src="https://imasdk.googleapis.com/js/sdkloader/ima3.js"></script>
</head>
<body>
  <div id="main-container">
    <div id="status-overlay">
      <div class="spinner" id="spinner"></div>
      <div class="status-text" id="status-text">Loading video ad...</div>
    </div>
    <video id="content-video" playsinline muted></video>
    <div id="ad-container"></div>
  </div>

  <script>
    let adsManager;
    let adsLoader;
    let adDisplayContainer;

    const videoContent = document.getElementById('content-video');
    const adContainer = document.getElementById('ad-container');
    const statusOverlay = document.getElementById('status-overlay');
    const statusText = document.getElementById('status-text');
    const spinner = document.getElementById('spinner');

    // Cross-platform event dispatcher to Flutter (flutter_inappwebview)
    function notifyFlutter(eventName, data = {}) {
      const payload = { event: eventName, ...data };
      console.log('[AjantaAdPlayer] Dispatching event:', payload);

      if (window.flutter_inappwebview && window.flutter_inappwebview.callHandler) {
        window.flutter_inappwebview.callHandler('onAdEvent', payload);
      } else if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage(JSON.stringify(payload));
      }
    }

    function initPlayer() {
      // Create ad display container
      adDisplayContainer = new google.ima.AdDisplayContainer(adContainer, videoContent);

      // Create ads loader
      adsLoader = new google.ima.AdsLoader(adDisplayContainer);
      adsLoader.addEventListener(
        google.ima.AdsManagerLoadedEvent.Type.ADS_MANAGER_LOADED,
        onAdsManagerLoaded,
        false
      );
      adsLoader.addEventListener(
        google.ima.AdErrorEvent.Type.AD_ERROR,
        onAdError,
        false
      );

      // Extract adTag from URL query parameter, fallback to Google sample VAST linear tag
      const urlParams = new URLSearchParams(window.location.search);
      const adTagUrl = urlParams.get('adTag') ||
        'https://pubads.g.doubleclick.net/gampad/ads?iu=/21775744923/external/single_ad_samples&sz=640x480&cust_params=sample_ct%3Dlinear&ciu_szs=300x250%2C728x90&gdfp_req=1&output=vast&unviewed_position_start=1&env=vp&impl=s&correlator=' + Date.now();

      requestAds(adTagUrl);
    }

    function requestAds(adTagUrl) {
      adDisplayContainer.initialize();
      const adsRequest = new google.ima.AdsRequest();
      adsRequest.adTagUrl = adTagUrl;
      adsRequest.linearAdSlotWidth = window.innerWidth;
      adsRequest.linearAdSlotHeight = window.innerHeight;
      adsRequest.nonLinearAdSlotWidth = window.innerWidth;
      adsRequest.nonLinearAdSlotHeight = window.innerHeight;
      adsLoader.requestAds(adsRequest);
    }

    function onAdsManagerLoaded(adsManagerLoadedEvent) {
      if (statusOverlay) statusOverlay.style.display = 'none';

      const adsRenderingSettings = new google.ima.AdsRenderingSettings();
      adsRenderingSettings.restoreCustomPlaybackStateOnFocus = true;

      adsManager = adsManagerLoadedEvent.getAdsManager(videoContent, adsRenderingSettings);

      // Error handling
      adsManager.addEventListener(google.ima.AdErrorEvent.Type.AD_ERROR, onAdError);

      // Lifecycle events
      adsManager.addEventListener(google.ima.AdEvent.Type.STARTED, (e) => {
        const ad = e.getAd();
        notifyFlutter('STARTED', {
          duration: ad ? ad.getDuration() : 0,
          title: ad ? ad.getTitle() : '',
          isSkippable: ad ? ad.getSkipTimeOffset() >= 0 : false
        });
      });

      adsManager.addEventListener(google.ima.AdEvent.Type.PAUSED, () => {
        notifyFlutter('PAUSED');
      });

      adsManager.addEventListener(google.ima.AdEvent.Type.RESUMED, () => {
        notifyFlutter('RESUMED');
      });

      adsManager.addEventListener(google.ima.AdEvent.Type.SKIPPED, () => {
        notifyFlutter('SKIPPED');
      });

      adsManager.addEventListener(google.ima.AdEvent.Type.COMPLETE, () => {
        notifyFlutter('COMPLETED');
      });

      adsManager.addEventListener(google.ima.AdEvent.Type.ALL_ADS_COMPLETED, () => {
        notifyFlutter('ALL_ADS_COMPLETED');
      });

      try {
        adsManager.init(window.innerWidth, window.innerHeight, google.ima.ViewMode.NORMAL);
        adsManager.start();
      } catch (adError) {
        onAdError(adError);
      }
    }

    function onAdError(adErrorEvent) {
      if (adsManager) {
        adsManager.destroy();
      }
      if (spinner) spinner.style.display = 'none';
      if (statusOverlay) statusOverlay.style.display = 'flex';
      const msg = adErrorEvent.getError ? adErrorEvent.getError().toString() : 'Ad playback error';
      if (statusText) statusText.innerText = 'Unable to play ad.';
      notifyFlutter('ERROR', { error: msg });
    }

    window.addEventListener('resize', () => {
      if (adsManager) {
        adsManager.resize(window.innerWidth, window.innerHeight, google.ima.ViewMode.NORMAL);
      }
    });

    window.onload = initPlayer;
  </script>
</body>
</html>
