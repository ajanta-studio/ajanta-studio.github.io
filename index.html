<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-adsense-account" content="ca-pub-3532576239814430">
  <title>Ajanta Studio</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 30%, #1e293b 0%, #0b0f17 100%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 48px;
      border-radius: 20px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .logo {
      font-size: 40px;
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .tagline {
      color: #94a3b8;
      font-size: 16px;
      margin-bottom: 32px;
      line-height: 1.5;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      padding: 8px 16px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 24px;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      background: #38bdf8;
      border-radius: 50%;
      box-shadow: 0 0 8px #38bdf8;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: block;
      padding: 12px 20px;
      background: #1e293b;
      color: #e2e8f0;
      text-decoration: none;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: #334155;
      border-color: #38bdf8;
      color: #ffffff;
    }
    footer {
      margin-top: 32px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Ajanta Studio</div>
    <div class="tagline">Creative Vector Tools &amp; Next-Generation Rendering</div>

    <div class="status-badge">
      <div class="pulse-dot"></div>
      Ad &amp; Verification Services Online
    </div>

    <div class="links">
      <a href="player.html" class="btn">Test IMA Ad Player</a>
      <a href="ads.txt" class="btn">View ads.txt</a>
      <a href="app-ads.txt" class="btn">View app-ads.txt</a>
    </div>
  </div>

  <footer>
    &copy; 2026 Ajanta Studio. All rights reserved.
  </footer>
</body>
</html>
